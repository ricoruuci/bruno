info:
  name: get supplier
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_URL}}/supplier"
  body:
    type: json
    data: |-
      {
         "suppid": "A002",
         "suppidkeyword" : "",
         "suppnamekeyword" : "",
      //   sortby = suppid, suppname
         "sortby" : "suppid"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
