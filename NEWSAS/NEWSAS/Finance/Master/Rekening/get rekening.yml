info:
  name: get rekening
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_URL}}/rekening"
  body:
    type: json
    data: |
      {
          "rekeningid" : "110001.0001",
          "rekeningidkeyword" : "",
          "rekeningnamekeyword" : "",
          "grouprekidkeyword" : "",
          "groupnamekeyword" : "",
          //fgactive = Y,T
          "fgactive" : "Y",
          //sortby = grouprekid, grouprekname, rekeningid, rekeningname
          "sortby" : "grouprekid"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
