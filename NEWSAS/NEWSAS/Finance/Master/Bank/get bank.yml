info:
  name: get bank
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_URL}}/bank"
  body:
    type: json
    data: |
      {
        "bankid": "BCA",
        //fgactive = Y, T
        "fgactive" : "Y",
        "bankidkeyword" : "",
        "banknamekeyword" : "",
        //sortby = id, name
        "sortby" : "id"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
